site_name: svinx-validator
site_description: Framework web PHP moderne pour construire des API — cours complet
site_url: https://svinx-org.github.io/validator/
repo_url: https://github.com/svinx-org/validator
repo_name: svinx-org/validator
docs_dir: docs

# Fichiers de travail qui ne doivent pas être publiés :
# - language_names.yml : langues utilisées par scripts/translate.py ;
# - .manifest.json : empreintes des traductions (docs/<lang>/.manifest.json).
exclude_docs: |
  language_names.yml
  **/.manifest.json
edit_uri: edit/develop/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          name: Français
          default: true
        - locale: en
          name: English
          nav_translations:
            Accueil: Home
            Installation: Installation
            Premiers pas: First steps
            Champs et contraintes: Fields and constraints
            Modèles imbriqués: Nested models
            Types validés: Validated types
            Validateurs personnalisés: Custom validators
            Types et annotations: Typing
            TypeAdapter: Type adapter
            Configuration: Configuration
            Settings: Settings
            Schémas: Schemas
            Erreurs: Errors
            Référence API: Reference
            

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Accueil: index.md
  - Installation: installation.md
  - Premiers pas: first-steps.md
  - Champs et contraintes: fields-and-constraints.md
  - Modèles imbriqués: nested-models.md
  - Types validés: validated-types.md
  - Validateurs personnalisés: custom-validators.md
  - Types et annotations: typing.md
  - TypeAdapter: type-adapter.md
  - Configuration: configuration.md
  - Settings: settings.md
  - Schémas: schemas.md
  - Erreurs: errors.md
  - Référence API: reference.md

extra:
  social:
  - icon: octicons/mark-github-24
    link: https://github.com/svinx-org/validator
  - icon: fontawesome/brands/x-twitter
    link: https://x.com/eor_bah545
